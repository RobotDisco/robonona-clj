---
# Chat backend: "slack" or "mattermost"
chatBackend: "slack"

# Slack configuration (required when chatBackend: slack)
slack:
  token: ""  # Slack bot token (stored as Secret)
  channel: ""  # Slack channel ID

# Mattermost configuration (required when chatBackend: mattermost)
mattermost:
  url: ""  # Mattermost API base URL (e.g., https://mattermost.example.com/api/v4)
  token: ""  # Personal access token or bot token (stored as Secret)
  team: ""  # Team name
  channel: ""  # Channel name

# Matching configuration
match:
  algorithm: "random"  # "random" or "round-robin"

# Persistence for round-robin history
persistence:
  enabled: false  # Enable for round-robin matching
  size: 100Mi
  storageClassName: ""  # Use default storage class
