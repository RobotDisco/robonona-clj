---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "coffeebot.fullname" . }}
  labels:
    {{- include "coffeebot.labels" . | nindent 4 }}
spec:
  schedule: "30 12 * * 1"  # Every Monday at 08:30 EDT / 07:30 EST (12:30 UTC)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "coffeebot.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: coffeebot
              image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: ROBONONA_CHAT_BACKEND
                  value: {{ .Values.chatBackend | quote }}
                - name: ROBONONA_MATCH_ALGORITHM
                  value: {{ .Values.match.algorithm | quote }}
                {{- if .Values.persistence.enabled }}
                - name: ROBONONA_MATCH_HISTORY_FILE
                  value: "/data/history.edn"
                {{- end }}
                {{- if eq .Values.chatBackend "slack" }}
                - name: ROBONONA_SLACK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "coffeebot.fullname" . }}
                      key: slack-token
                - name: ROBONONA_SLACK_CHANNEL
                  value: {{ .Values.slack.channel | quote }}
                {{- end }}
                {{- if eq .Values.chatBackend "mattermost" }}
                - name: ROBONONA_MATTERMOST_URL
                  value: {{ .Values.mattermost.url | quote }}
                - name: ROBONONA_MATTERMOST_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "coffeebot.fullname" . }}
                      key: mattermost-token
                - name: ROBONONA_MATTERMOST_TEAM
                  value: {{ .Values.mattermost.team | quote }}
                - name: ROBONONA_MATTERMOST_CHANNEL
                  value: {{ .Values.mattermost.channel | quote }}
                {{- end }}
              {{- if .Values.persistence.enabled }}
              volumeMounts:
                - name: history
                  mountPath: /data
              {{- end }}
              resources:
                limits:
                  memory: "256Mi"
                requests:
                  memory: "128Mi"
                  cpu: "100m"
          {{- if .Values.persistence.enabled }}
          volumes:
            - name: history
              persistentVolumeClaim:
                claimName: {{ include "coffeebot.fullname" . }}-history
          {{- end }}
