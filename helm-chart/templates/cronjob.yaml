---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "coffeebot.fullname" . }}
  labels:
    {{- include "coffeebot.labels" . | nindent 4 }}
spec:
  schedule: "30 12 * * 1"  # Every Monday at 08:30 EDT / 07:30 EST (12:30 UTC)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            {{- include "coffeebot.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          containers:
            - name: coffeebot
              image: my-image-repo.io/coffeebot:2.1.0
              imagePullPolicy: IfNotPresent
              env:
                - name: SLACK_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "coffeebot.fullname" . }}
                      key: slack-token
                - name: SLACK_CHANNEL
                  value: {{ .Values.slackChannel | quote }}
                - name: MATCH_ALGORITHM
                  value: {{ .Values.matchAlgorithm | quote }}
                {{- if .Values.persistence.enabled }}
                - name: HISTORY_FILE
                  value: "/data/history.edn"
                {{- end }}
              {{- if .Values.persistence.enabled }}
              volumeMounts:
                - name: history
                  mountPath: /data
              {{- end }}
              resources:
                limits:
                  memory: "256Mi"
                requests:
                  memory: "128Mi"
                  cpu: "100m"
          {{- if .Values.persistence.enabled }}
          volumes:
            - name: history
              persistentVolumeClaim:
                claimName: {{ include "coffeebot.fullname" . }}-history
          {{- end }}
